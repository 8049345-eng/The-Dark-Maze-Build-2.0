<title>The Dark Maze</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030303;color:#eee;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.wrap{width:min(900px,92vw);padding:60px 30px;text-align:center;border:1px solid #252525;background:radial-gradient(circle at 50% 35%,#171717 0,#080808 42%,#020202 100%);box-shadow:0 0 80px #000, inset 0 0 60px #000}.title{font-size:clamp(46px,10vw,100px);font-weight:900;line-height:.82;letter-spacing:8px;text-shadow:0 0 8px #fff,0 0 28px #777;margin-bottom:22px}.sub{letter-spacing:5px;color:#888;font-size:13px;margin-bottom:55px}.play{display:inline-block;padding:18px 50px;border:1px solid #eee;background:#eee;color:#050505;text-decoration:none;font-weight:900;letter-spacing:3px;font-size:18px;transition:.15s}.play:hover{background:#fff;transform:scale(1.04);box-shadow:0 0 30px #aaa}.info{margin-top:40px;color:#555;font-size:12px;letter-spacing:2px}.danger{margin-top:12px;color:#7d0000;letter-spacing:4px;font-weight:bold}@media(max-width:600px){.wrap{padding:45px 18px}.sub{letter-spacing:3px}.play{padding:16px 34px}}
